# =====================================================================
#  ROBOT « PLAY STORE » — construit l'appli Android et l'envoie à Google
# ---------------------------------------------------------------------
#  Quand se déclenche-t-il ?
#   - à chaque push qui modifie android/** ou fastlane/** (la coquille
#     Android ou la fiche du Play Store : texte, captures, nouveautés) ;
#   - à la demande : onglet « Actions » > « Play Store » > « Run workflow ».
#
#  ⚠️ Une simple leçon ou une correction du site NE passe PAS par ici :
#  l'appli affiche le site baiji.fr, donc un push sur le site suffit.
#
#  Les secrets nécessaires (Réglages du dépôt > Secrets and variables > Actions) :
#   - ANDROID_KEYSTORE_BASE64   : la clé de signature (fichier .jks en base64)
#   - ANDROID_KEYSTORE_PASSWORD : son mot de passe
#   - PLAY_SERVICE_ACCOUNT_JSON : (facultatif) la clé du « compte de service »
#     Google qui a le droit de publier. Sans lui, le robot fabrique seulement
#     le fichier .aab et le dépose dans « Releases » du dépôt.
#
#  (Secrets de signature et de publication ajoutés le 1er novembre 2026.)
#
#  Compte rendu : le robot écrit son résultat dans le fichier statut.json de
#  la branche « statut-play » (Claude peut le lire, alors qu'il n'a pas accès
#  aux journaux des Actions).
# =====================================================================
name: Play Store

on:
  push:
    branches: [main]
    paths: ['android/**', 'fastlane/**', '.github/workflows/play-store.yml']
  workflow_dispatch:
    inputs:
      piste:
        description: 'Piste du Play Store (internal = test interne, alpha = test fermé, production)'
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]
      statut:
        description: 'completed = publié tout de suite ; draft = brouillon à valider dans la console'
        default: 'completed'
        type: choice
        options: [completed, draft]

# Le robot a le droit d'écrire dans le dépôt (Release + branche statut-play)
permissions:
  contents: write

# Deux exécutions en même temps se gêneraient (numéros de version) : on les met en file
concurrency:
  group: play-store
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Par défaut (push) : piste « internal », publiée directement
      PISTE: ${{ inputs.piste || 'internal' }}
      STATUT: ${{ inputs.statut || 'completed' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17 (nécessaire pour Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle (avec cache, pour aller plus vite la prochaine fois)
        uses: gradle/actions/setup-gradle@v4

      - name: Calculer les numéros de version
        id: version
        run: |
          # versionName = le numéro de version.js (ex. 1.6.1)
          NOM=$(grep -oP "VERSION = '\K[^']+" version.js)
          # versionCode = un entier qui augmente toujours : 100 + numéro d'exécution du robot
          CODE=$((100 + ${{ github.run_number }}))
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NOM (code $CODE)"

      - name: Reconstituer la clé de signature à partir des secrets
        env:
          CLE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Sans clé, on construit quand même (pour vérifier que tout compile), mais on n'enverra rien
          if [ -z "$CLE_B64" ]; then echo "::warning::Secret ANDROID_KEYSTORE_BASE64 manquant : appli NON signée"; exit 0; fi
          # La clé est écrite hors du dépôt, dans le dossier temporaire du robot
          echo "$CLE_B64" | base64 -d > "$RUNNER_TEMP/revisions-upload.jks"
          echo "CLE_FICHIER=$RUNNER_TEMP/revisions-upload.jks" >> "$GITHUB_ENV"

      - name: Construire l'appli (.aab signé)
        working-directory: android
        env:
          CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.nom }}
        run: |
          chmod +x gradlew
          # Le journal est gardé pour le compte rendu (pipefail : un échec de Gradle fait échouer l'étape)
          set -o pipefail
          ./gradlew --no-daemon bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/mes-revisions-${{ steps.version.outputs.nom }}-${{ steps.version.outputs.code }}.aab"

      - name: Déposer le .aab dans les « Releases » du dépôt
        if: env.CLE_FICHIER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ETIQUETTE="android-${{ steps.version.outputs.code }}"
          gh release create "$ETIQUETTE" "$RUNNER_TEMP"/mes-revisions-*.aab \
            --title "Android ${{ steps.version.outputs.nom }} (code ${{ steps.version.outputs.code }})" \
            --notes "Fichier à téléverser sur le Play Store (seulement la toute première fois : ensuite le robot l'envoie lui-même)."

      # Ruby (le langage de fastlane), installé dans le dossier du robot : pas besoin de « sudo »
      - name: Installer Ruby (pour fastlane)
        if: env.CLE_FICHIER != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Envoyer sur le Play Store (fastlane supply)
        id: play
        if: env.CLE_FICHIER != ''
        env:
          CLE_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Toute la sortie de cette étape va aussi dans fastlane.log (pour le compte rendu)
          exec > >(tee -a "$RUNNER_TEMP/fastlane.log") 2>&1
          if [ -z "$CLE_PLAY" ]; then
            echo "Pas de secret PLAY_SERVICE_ACCOUNT_JSON : envoi sur le Play Store sauté."
            echo "envoye=non" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$CLE_PLAY" > "$RUNNER_TEMP/play.json"
          gem install fastlane --no-document --silent
          # Les « nouveautés » de cette version : le fichier default.txt sert pour toutes
          cp fastlane/metadata/android/fr-FR/changelogs/default.txt \
             "fastlane/metadata/android/fr-FR/changelogs/${{ steps.version.outputs.code }}.txt"
          # supply envoie : le .aab + la fiche (titre, descriptions, icône, captures)
          fastlane supply \
            --package_name io.github.svaug12345.revisions \
            --json_key "$RUNNER_TEMP/play.json" \
            --aab "$(ls "$RUNNER_TEMP"/mes-revisions-*.aab)" \
            --track "$PISTE" \
            --release_status "$STATUT" \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk true
          echo "envoye=oui" >> "$GITHUB_OUTPUT"

      # Toujours exécutée, même en cas d'échec : écrit le compte rendu sur la branche statut-play
      - name: Écrire le compte rendu (branche statut-play)
        if: always()
        run: |
          # jq fabrique un JSON propre ; « journal » = les 40 dernières lignes de Gradle ou fastlane
          # (Claude n'a pas accès aux journaux des Actions : c'est sa seule façon de comprendre une erreur)
          touch "$RUNNER_TEMP/gradle.log" "$RUNNER_TEMP/fastlane.log"
          jq -n \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg resultat "${{ job.status }}" \
            --arg version "${{ steps.version.outputs.nom }}" \
            --arg versionCode "${{ steps.version.outputs.code }}" \
            --arg piste "$PISTE" --arg statutPlay "$STATUT" \
            --arg signee "$([ -n "$CLE_FICHIER" ] && echo oui || echo non)" \
            --arg envoyeSurPlay "${{ steps.play.outputs.envoye || 'non' }}" \
            --arg commit "${{ github.sha }}" \
            --arg lien "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg gradle "$(tail -n 40 "$RUNNER_TEMP/gradle.log")" \
            --arg fastlane "$(tail -n 40 "$RUNNER_TEMP/fastlane.log")" \
            '$ARGS.named' > "$RUNNER_TEMP/statut.json"
          cd "$RUNNER_TEMP"
          git init -q statut && cd statut
          git config user.name "robot-play-store"
          git config user.email "actions@users.noreply.github.com"
          cp ../statut.json .
          git add statut.json && git commit -qm "Statut Play Store : ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:statut-play
