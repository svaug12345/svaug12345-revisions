<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Avatar de Titouan : ballon de foot qui file vers le but. Dessin original (aucun logo de club). -->
  <!-- Traits de vitesse -->
  <path d="M8 40h18M4 52h20M10 64h16" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <!-- Ombre au sol -->
  <ellipse cx="60" cy="88" rx="22" ry="4" fill="#1e3a8a" opacity=".18"/>
  <!-- Ballon : un cercle blanc, un pentagone central et 5 « coutures » vers les bords -->
  <circle cx="60" cy="50" r="30" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <path d="M60 39l10.5 7.6-4 12.4h-13l-4-12.4z" fill="#1e293b"/>
  <g stroke="#1e293b" stroke-width="3" stroke-linecap="round">
    <path d="M60 39V22"/><path d="M70.5 46.6l15-5"/><path d="M66.5 59l9 13"/>
    <path d="M53.5 59l-9 13"/><path d="M49.5 46.6l-15-5"/>
  </g>
  <!-- Morceaux de pentagones sur les bords -->
  <path d="M52 21.3l8-1.3 8 1.3-3 5h-10z" fill="#1e293b"/>
  <path d="M88 44l1 9-4 6-3-7z" fill="#1e293b"/>
  <path d="M32 44l-1 9 4 6 3-7z" fill="#1e293b"/>
  <path d="M70 78l-10 2-10-2 5-5h10z" fill="#1e293b"/>
  <!-- Reflet -->
  <path d="M42 34a22 22 0 0 1 10-8" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
