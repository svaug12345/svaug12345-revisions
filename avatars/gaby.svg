<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Avatar de Gaby : guerrière ninja. Dessin original (formes simples). -->
  <!-- Katana dans le dos (passe derrière la tête) -->
  <g transform="rotate(-42 50 50)">
    <rect x="47" y="2" width="6" height="58" rx="3" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="49" y="6" width="1.6" height="50" fill="#fff" opacity=".8"/>
    <rect x="41" y="60" width="18" height="5" rx="2.5" fill="#f59e0b"/>
    <rect x="46.5" y="65" width="7" height="22" rx="3" fill="#7c2d12"/>
    <path d="M46.5 69h7M46.5 74h7M46.5 79h7" stroke="#fbbf24" stroke-width="1.6"/>
  </g>
  <!-- Tête encapuchonnée -->
  <circle cx="50" cy="54" r="30" fill="#1e1b4b"/>
  <!-- Ouverture du visage -->
  <rect x="27" y="45" width="46" height="18" rx="9" fill="#fcd9b6"/>
  <!-- Yeux déterminés -->
  <ellipse cx="40" cy="54" rx="4.2" ry="4.8" fill="#1f2937"/>
  <ellipse cx="60" cy="54" rx="4.2" ry="4.8" fill="#1f2937"/>
  <circle cx="41.5" cy="52.3" r="1.5" fill="#fff"/>
  <circle cx="61.5" cy="52.3" r="1.5" fill="#fff"/>
  <path d="M33 47.5l11 3M67 47.5l-11 3" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Bandeau rose noué, avec ses deux pans qui flottent -->
  <rect x="21" y="36" width="58" height="8" rx="4" fill="#ec4899"/>
  <circle cx="50" cy="40" r="3.4" fill="#fbcfe8"/>
  <path d="M78 39c8-4 13-2 17 3-5 0-9 1-13 4z" fill="#ec4899"/>
  <path d="M78 42c6 2 9 6 10 12-4-3-8-5-12-6z" fill="#db2777"/>
  <!-- Masque du bas -->
  <path d="M26 62q24 10 48 0v4q-24 14-48 0z" fill="#312e81"/>
