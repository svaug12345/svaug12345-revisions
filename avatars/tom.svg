<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Avatar de Tom : sabre laser vert. Dessin original et générique. -->
  <defs>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#475569"/><stop offset=".45" stop-color="#e2e8f0"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <g transform="rotate(40 50 50)">
    <!-- Halo lumineux puis lame -->
    <rect x="43" y="2" width="14" height="64" rx="7" fill="#22c55e" filter="url(#halo)" opacity=".9"/>
    <rect x="45.5" y="4" width="9" height="60" rx="4.5" fill="#4ade80"/>
    <rect x="47.8" y="6" width="4.4" height="56" rx="2.2" fill="#f0fdf4"/>
    <!-- Poignée -->
    <rect x="43" y="63" width="14" height="5" rx="1.5" fill="#1e293b"/>
    <rect x="44" y="67" width="12" height="27" rx="2.5" fill="url(#metal)"/>
    <path d="M44 72h12M44 76h12M44 80h12M44 84h12" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="54.5" y="70" width="4" height="6" rx="1.5" fill="#ef4444"/>
    <rect x="43" y="92" width="14" height="4" rx="2" fill="#1e293b"/>
  </g>
  <!-- Petites étincelles -->
  <path d="M80 18l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#bbf7d0"/>
  <circle cx="20" cy="30" r="2" fill="#bbf7d0"/>
</svg>
